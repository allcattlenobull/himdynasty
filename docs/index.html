<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIM Dynasty</title>
  <meta name="description" content="HIM Dynasty. Are you HIM?">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HIM Dynasty">
  <meta property="og:title" content="HIM Dynasty">
  <meta property="og:description" content="Are you HIM? The HIM Dynasty fantasy league: standings, playoff odds, weekly recaps, mock drafts, trades and history.">
  <meta property="og:url" content="https://allcattlenobull.github.io/himdynasty/">
  <meta property="og:image" content="https://allcattlenobull.github.io/himdynasty/og/site.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://allcattlenobull.github.io/himdynasty/og/site.png">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/brand.css?v=20261015a">
  <script src="assets/theme.js?v=20261015a"></script>
</head>
<body class="gate">
  <div class="corner-toggle" data-theme-toggle></div>
  <main class="gate-main">
    <img class="gate-logo" src="assets/logo.svg" alt="HIM Dynasty logo" width="150" height="150">
    <p class="gate-kicker">HIM DYNASTY</p>
    <h1 class="gate-q"><span class="pre">Are you</span><span class="him">HIM?</span></h1>
    <div class="gate-actions">
      <a class="btn btn-yes" href="league.html">Yes</a>
      <a class="btn btn-no" href="no.html">No</a>
    </div>
    <p class="gate-hint">Press <kbd>Y</kbd> or <kbd>N</kbd></p>
  </main>
  <footer class="gate-credit"><a class="credit" href="mailto:paforprince@gmail.com">Built by P Saah</a></footer>
  <script>
    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const key = e.key.toLowerCase();
      if (key === "y") location.href = "league.html";
      if (key === "n") location.href = "no.html";
    });
  </script>
</body>
</html>
