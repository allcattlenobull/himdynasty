<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIM Dynasty</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171b22;
      --line: #2a303b;
      --text: #e8ecf2;
      --muted: #8b95a5;
      --accent: #f5b301;
      --good: #3fb97a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    header {
      padding: 2rem 1.25rem 1.25rem;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .slogan {
      margin: 0.35rem 0 0;
      font-size: 1.15rem;
      color: var(--text);
      font-style: italic;
    }
    .updated { margin: 0.75rem 0 0; color: var(--muted); font-size: 0.85rem; }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1.25rem;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.1rem 1.2rem;
      overflow-x: auto;
    }
    h2 {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 0.55rem 0.5rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .team { font-weight: 600; }
    .owner { color: var(--muted); font-size: 0.85rem; }
    .odds-cell { min-width: 150px; }
    .odds-bar {
      display: inline-block;
      vertical-align: middle;
      width: 90px;
      height: 8px;
      background: var(--line);
      border-radius: 4px;
      overflow: hidden;
      margin-right: 0.5rem;
    }
    .odds-bar span { display: block; height: 100%; background: var(--good); }
    .draft-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; }
    .draft-grid h3 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
    ol { margin: 0; padding-left: 1.5rem; }
    ol li { padding: 0.25rem 0; }
    .empty, .error { color: var(--muted); }
    .error { color: #ff7b72; }
  </style>
</head>
<body>
  <header>
    <h1>HIM DYNASTY</h1>
    <p class="slogan">Are you HIM?</p>
    <p class="updated" id="updated">Loading league data…</p>
  </header>

  <main>
    <section>
      <h2>Standings &amp; Playoff Odds</h2>
      <div id="standings"><p class="empty">Loading…</p></div>
    </section>

    <section>
      <h2>Draft Order</h2>
      <div class="draft-grid">
        <div>
          <h3>Projected next draft (worst record first)</h3>
          <div id="projected"><p class="empty">Loading…</p></div>
        </div>
        <div>
          <h3>Official order</h3>
          <div id="official"><p class="empty">Loading…</p></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Build an element with text content only. Team and owner names come from
    // Sleeper, so they are never inserted as HTML.
    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined && text !== null) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function showError(target, message) {
      target.replaceChildren(el("p", message, "error"));
    }

    function renderStandings(standings) {
      const table = el("table");
      const head = el("tr");
      ["#", "Team", "Record", "PF", "PA", "Proj. W", "Playoff odds"].forEach((label, i) => {
        head.appendChild(el("th", label, i >= 2 && i <= 5 ? "num" : ""));
      });
      table.appendChild(el("thead")).appendChild(head);

      const body = el("tbody");
      for (const row of standings) {
        const tr = el("tr");
        tr.appendChild(el("td", row.rank, "num"));

        const teamCell = el("td");
        teamCell.appendChild(el("div", row.team, "team"));
        teamCell.appendChild(el("div", row.owner, "owner"));
        tr.appendChild(teamCell);

        const record = row.ties ? `${row.wins}-${row.losses}-${row.ties}` : `${row.wins}-${row.losses}`;
        tr.appendChild(el("td", record, "num"));
        tr.appendChild(el("td", row.points_for.toFixed(1), "num"));
        tr.appendChild(el("td", row.points_against.toFixed(1), "num"));
        tr.appendChild(el("td", row.projected_wins.toFixed(1), "num"));

        const oddsCell = el("td", null, "odds-cell");
        const bar = el("span", null, "odds-bar");
        const fill = el("span");
        fill.style.width = `${Math.min(100, row.playoff_odds)}%`;
        bar.appendChild(fill);
        oddsCell.appendChild(bar);
        oddsCell.appendChild(document.createTextNode(`${row.playoff_odds.toFixed(1)}%`));
        tr.appendChild(oddsCell);

        body.appendChild(tr);
      }
      table.appendChild(body);
      return table;
    }

    function renderOrder(rows) {
      const list = el("ol");
      for (const row of rows) {
        const li = el("li");
        li.appendChild(el("span", row.team, "team"));
        li.appendChild(document.createTextNode(" "));
        li.appendChild(el("span", `(${row.owner})`, "owner"));
        list.appendChild(li);
      }
      return list;
    }

    async function load() {
      try {
        const res = await fetch("data/latest.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const when = new Date(data.generated_at);
        document.getElementById("updated").textContent =
          `${data.league.name || "League"} · ${data.league.season} season · updated ${when.toLocaleString()}`;

        document.getElementById("standings").replaceChildren(renderStandings(data.standings));

        const projected = document.getElementById("projected");
        projected.replaceChildren(renderOrder(data.draft.projected_order));

        const official = document.getElementById("official");
        if (data.draft.official_order) {
          official.replaceChildren(renderOrder(data.draft.official_order));
        } else {
          official.replaceChildren(el("p", "No official order set yet.", "empty"));
        }
      } catch (err) {
        const msg = `Could not load league data (${err.message}).`;
        showError(document.getElementById("standings"), msg);
        showError(document.getElementById("projected"), msg);
        showError(document.getElementById("official"), msg);
        document.getElementById("updated").textContent = "Data unavailable";
      }
    }

    load();
  </script>
</body>
</html>
