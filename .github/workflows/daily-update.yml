name: Daily HIM Dynasty update

on:
  schedule:
    # 08:00 UTC = 3:00 AM Eastern standard time (4:00 AM during daylight saving).
    # GitHub may start scheduled runs a few minutes late.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch league data from Sleeper
        run: python scripts/update_league.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update league data $(date -u +%Y-%m-%d)"
            git push
          fi
