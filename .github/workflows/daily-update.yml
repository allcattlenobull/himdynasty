name: Daily HIM Dynasty update

on:
  schedule:
    # GitHub cron runs in UTC. 4:00 AM Central is 09:00 UTC during daylight
    # saving (CDT) and 10:00 UTC the rest of the year (CST). Both are scheduled
    # and the gate step below lets only the matching one run.
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run only at 4 AM Central
        id: gate
        run: |
          offset="$(TZ=America/Chicago date +%z)"
          schedule="${{ github.event.schedule }}"
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$offset" = "-0500" ] && [ "$schedule" != "0 9 * * *" ]; then run=false; fi
            if [ "$offset" = "-0600" ] && [ "$schedule" != "0 10 * * *" ]; then run=false; fi
          fi
          echo "Chicago UTC offset $offset, schedule '$schedule', run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch league data from Sleeper
        if: steps.gate.outputs.run == 'true'
        run: python scripts/update_league.py

      - name: Build trade values
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/trade_values.py

      - name: Build the rookie mock draft
        if: steps.gate.outputs.run == 'true'
        # A source being down should never block the league update.
        continue-on-error: true
        run: python scripts/mock_draft.py

      - name: Commit updated data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update league data $(TZ=America/Chicago date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
