name: Daily HIM Dynasty update

on:
  schedule:
    # GitHub cron runs in UTC and can delay or drop runs at the top of the hour,
    # so there are several off-peak attempts between 09:00 and 12:59 UTC
    # (4:00-7:59 AM CDT, 3:00-6:59 AM CST). The gate below makes the first
    # attempt at or after 4:00 AM Central do the update; later ones skip.
    - cron: "8,28,48 9-12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run once a day, at or after 4 AM Central
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run: always update."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, zoneinfo
          ct = zoneinfo.ZoneInfo("America/Chicago")
          now = dt.datetime.now(ct)
          cutoff = now.replace(hour=4, minute=0, second=0, microsecond=0)
          try:
              last = dt.datetime.fromisoformat(json.load(open("docs/data/latest.json"))["generated_at"]).astimezone(ct)
          except Exception:
              last = None
          run = now >= cutoff and (last is None or last < cutoff)
          import sys
          print(f"Now {now:%Y-%m-%d %H:%M} CT, last update {last}, run={run}", file=sys.stderr)
          print(f"run={'true' if run else 'false'}")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch league data from Sleeper
        if: steps.gate.outputs.run == 'true'
        run: python scripts/update_league.py

      - name: Build trade values
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/trade_values.py

      - name: Build player analytics (nflverse)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/analytics_data.py

      - name: Write team analysis
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/analysis.py

      - name: Collect player news
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/news.py

      - name: Build the rookie mock draft
        if: steps.gate.outputs.run == 'true'
        # A source being down should never block the league update.
        continue-on-error: true
        run: python scripts/mock_draft.py

      - name: Find prospect highlight clips (YouTube)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/highlights.py

      - name: Commit updated data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update league data $(TZ=America/Chicago date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
